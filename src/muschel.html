<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEOMETRY DASH — Neubaustand</title>
<style>
  :root { --rand: #1c2242; --text: #dfe6ff; --stumpf: #7f8ab8; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #05060f; color: var(--text);
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 18px 12px 40px;
  }
  h1 { font-size: 15px; letter-spacing: .22em; margin: 0; color: #6fe9ff; font-weight: 600; }
  #titel { font-size: 13px; letter-spacing: .08em; }
  #buehne {
    width: min(960px, 100%); aspect-ratio: 16 / 9; display: block;
    background: #0b0d1a; border: 1px solid var(--rand); border-radius: 6px;
    touch-action: none; cursor: crosshair;
  }
  #liste { display: flex; flex-wrap: wrap; gap: 6px; max-width: 960px; justify-content: center; }
  #liste button {
    font: inherit; font-size: 11px; letter-spacing: .06em; cursor: pointer;
    background: #0e1226; color: var(--text);
    border: 1px solid var(--rand); border-left-width: 3px;
    border-radius: 4px; padding: 5px 9px;
  }
  #liste button:hover { background: #161c3a; }
  #fuss { font-size: 12px; color: var(--stumpf); min-height: 18px; text-align: center; }
  kbd {
    background: #161c3a; border: 1px solid var(--rand); border-radius: 3px;
    padding: 0 4px; font-size: 11px;
  }
  p.hinweis { font-size: 11px; color: var(--stumpf); max-width: 900px; margin: 0; text-align: center; }
</style>
</head>
<body>
<h1>GEOMETRY DASH</h1>
<div id="titel">&hellip;</div>
<canvas id="buehne" width="960" height="540"></canvas>
<div id="fuss"></div>
<div id="liste"></div>
<p class="hinweis">
  <kbd>Leertaste</kbd> / Maustaste / Touch = Sprung bzw. Steigen &middot;
  <kbd>R</kbd> Neustart &middot; <kbd>B</kbd> Bot uebernehmen &middot;
  <kbd>[</kbd> <kbd>]</kbd> Level wechseln
</p>
<!--BAU-->
</body>
</html>
